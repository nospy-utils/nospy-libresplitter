version: "3"
services:
  frontend:
    ports:
      - "8080:80"
    environment:
      - ENV=development
      - NGINX_SERVER_NAME=localhost
    volumes:
      - ./frontend/output:/usr/share/nginx/html:z
    restart: no
  backend:
    environment:
      - SECRET_KEY=dev-secret-change-in-production
    restart: no
