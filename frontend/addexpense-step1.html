<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open Splitwise - Add Expense</title>
    <link href="vendor/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/addexpense.css" rel="stylesheet">
</head>
<body>


<div class="container-sm">
    @@include('./header.html')
    <nav class="navbar navbar-light navbar-expand-lg">
        <div class="container-fluid">
            <div class="d-flex">
                <button class="btn btn-secondary" type="button" onclick="history.back()">Cancel</button>
            </div>
            <div class="d-flex">
                <span class="fs-4">Add expense</span>
            </div>
            <form class="d-flex" action="addexpense-step2.html">
                <button id="save-btn" class="btn btn-primary w-100" type="submit">Save</button>
            </form>
        </div>
    </nav>

    <div class="container addexpense-step1-content">
        <div class="row py-2">
            <div class="col">
                <small>Recent</small>
            </div>
        </div>
        <div class="row py-2">
            <div class="col-sm-2 col-lg-1 d-none d-sm-block">
                <div class="addexpense-step1-friend-thumbnail">
                    <img src="vendor/img/icons/person.svg" alt="placeholder"/>
                </div>
            </div>
            <div class="col-sm-10 col-lg-11 align-content-center">
                <div class="addexpense-step1-list-name">
                    <h3>Tatiana Almeida</h3>
                </div>
                <div class="addexpense-step1-list-input">
                    <input class="form-check-input addexpense-radio-input" type="checkbox" checked>
                </div>
            </div>
        </div>
    </div>

</div>


<script src="vendor/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/signout.js"></script>
</body>
</html>
