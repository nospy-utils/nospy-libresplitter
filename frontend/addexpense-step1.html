<!DOCTYPE html>
<html lang="en">
<head>
    @@include('./head-common.html')
    <title>LibreSplitter - Add Expense</title>
    <link href="css/addexpense.css" rel="stylesheet">
</head>
<body>


<div class="container-sm">
    @@include('./navbar.html')
    <nav class="navbar navbar-light navbar-expand-lg">
        <div class="container-fluid">
            <div class="d-flex">
                <button id="cancel-btn" class="btn btn-secondary" type="button">Cancel</button>
            </div>
            <div class="d-flex">
                <span class="fs-4">Add expense</span>
            </div>
            <div class="d-flex">
                <button id="save-btn" class="btn btn-primary w-100" type="button">Save</button>
            </div>
        </div>
    </nav>

    <div id="addexpensestep1-loadingpage-container" class="content-with-tabbar d-flex justify-content-center align-items-center ">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div id="addexpensestep1-content-container" class="container addexpense-step1-content invisible d-none">
        <div class="row py-2">
            <div class="col">
                <h3>Recent</h3>
            </div>
        </div>

        <div id="error-banner" class="error-banner alert alert-danger mt-3">
            <span id="error-message"></span>
        </div>

        <div id="friends-list"></div>
        <div id="scroll-sentinel"></div>
        <div id="loading-spinner" class="text-center py-3">
            <div class="spinner-border spinner-border-sm text-secondary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

</div>


<script src="vendor/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/signout.js"></script>
<script src="js/addexpense-step1.js"></script>
</body>
</html>
