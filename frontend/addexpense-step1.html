<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none';">
    <title>LibreSplitter - Add Expense</title>
    <link href="vendor/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/addexpense.css" rel="stylesheet">
</head>
<body>


<div class="container-sm">
    @@include('./header.html')
    <nav class="navbar navbar-light navbar-expand-lg">
        <div class="container-fluid">
            <div class="d-flex">
                <button id="cancel-btn" class="btn btn-secondary" type="button">Cancel</button>
            </div>
            <div class="d-flex">
                <span class="fs-4">Add expense</span>
            </div>
            <div class="d-flex">
                <button id="save-btn" class="btn btn-primary w-100" type="button">Save</button>
            </div>
        </div>
    </nav>

    <div class="container addexpense-step1-content">
        <div class="row py-2">
            <div class="col">
                <small>Recent</small>
            </div>
        </div>

        <div id="error-banner" class="error-banner alert alert-danger mt-3">
            <span id="error-message"></span>
        </div>

        <div id="friends-list"></div>
        <div id="scroll-sentinel"></div>
        <div id="loading-spinner" class="text-center py-3">
            <div class="spinner-border spinner-border-sm text-secondary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

</div>


<script src="vendor/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/signout.js"></script>
<script src="js/addexpense-step1.js"></script>
</body>
</html>
