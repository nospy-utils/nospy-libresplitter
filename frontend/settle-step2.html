<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none';">
    <title>LibreSplitter - Add Friend</title>
    <link href="vendor/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/settle-step2.css" rel="stylesheet">
</head>
<body>


<div class="container-sm">
    @@include('./header.html')

    <nav class="navbar navbar-light navbar-expand-lg">
        <div class="container-fluid">
            <div class="d-flex">
                <button class="btn btn-secondary" type="button" onclick="history.back()">Cancel</button>
            </div>
            <div class="d-flex">
                <span class="fs-4">Record a payment</span>
            </div>
            <div class="d-flex">
                <form id="settle-step2-form" method="post" action="#">
                    <button class="btn btn-primary" type="submit">Save</button>
                </form>
            </div>
        </div>
    </nav>
    <div class="row py-4">
        <div class="col text-end">
            <div class="settle-step2-friend-thumbnail">
                <img src="vendor/img/icons/person.svg" alt=""/>
            </div>
        </div>
        <div class="col text-center">
            <div class="settle-step2-arrow-icon">
                <img src="vendor/img/icons/arrow-right.svg" alt=""/>
            </div>
        </div>
        <div class="col text-start">
            <div class="settle-step2-friend-thumbnail">
                <img src="vendor/img/icons/person.svg" alt=""/>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col">
            <p class="text-center fs-5" id="settle-step2-fg-desc"></p>
        </div>
    </div>
    <div class="row">
        <div class="col">
            <div class="input-group mb-3">
                <span class="input-group-text" id="settle-step2-fg-currency">$</span>
                <input type="number" inputmode="decimal" class="form-control" id="settle-step2-fg-value">
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col">
            <p id="settle-step2-error" class="alert alert-danger invisible"></p>
        </div>
    </div>

</div>


<script src="vendor/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/signout.js"></script>
<script src="js/settle-step2.js"></script>
</body>
</html>
