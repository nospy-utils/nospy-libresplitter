<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open Splitwise - Add Friend</title>
    <link href="vendor/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/addfriend.css" rel="stylesheet">
</head>
<body>


<div class="container-sm">
    @@include('./header.html')
    <nav class="navbar navbar-light">
        <form action="friends.html">
            <button class="btn btn-secondary w-100" type="submit">Cancel</button>
        </form>
        <form id="addfriend-form">
            <button id="save-btn" class="btn btn-primary w-100" type="submit">Save</button>
        </form>
    </nav>

    <div class="py-4">
        <form>
            <div class="form-floating py-2">
                <input type="email" class="form-control" id="email" placeholder="">
                <label for="email">Email address</label>
            </div>
            <div id="addfriend-error" class="alert alert-danger mt-3"></div>
        </form>
    </div>
</div>


<script src="vendor/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/signout.js"></script>
<script src="js/addfriend.js"></script>
</body>
</html>
