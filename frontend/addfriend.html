<!DOCTYPE html>
<html lang="en">
<head>
    @@include('./head-common.html')
    <title>LibreSplitter - Add Friend</title>
    <link href="css/addfriend.css" rel="stylesheet">
</head>
<body>


<div class="container-sm">
    @@include('./navbar.html')

    <nav class="navbar navbar-light navbar-expand-lg">
        <div class="container-fluid">
            <div class="d-flex">
                <button id="cancel-btn" class="btn btn-secondary" type="button">Cancel</button>
            </div>
            <div class="d-flex">
                <span class="fs-4">Add friend</span>
            </div>
            <form class="d-flex" id="addfriend-form">
                <button id="save-btn" class="btn btn-primary w-100" type="submit">Save</button>
            </form>
        </div>
    </nav>

    <div class="py-4">
        <form>
            <div class="form-floating py-2">
                <input type="email" class="form-control" id="email" placeholder="">
                <label for="email">Email address</label>
            </div>
            <div id="addfriend-error" class="alert alert-danger mt-3 invisible"></div>
        </form>
    </div>
</div>


<script src="vendor/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/signout.js"></script>
<script src="js/addfriend.js"></script>
</body>
</html>
