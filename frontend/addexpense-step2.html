<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open Splitwise - Add Expense</title>
    <link href="vendor/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/addexpense.css" rel="stylesheet">
</head>
<body>

<div class="container-sm">
    @@include('./header.html')
    <nav class="navbar navbar-light navbar-expand-lg">
        <div class="container-fluid">
            <div class="d-flex">
                <button class="btn btn-secondary" type="button" onclick="history.back()">Cancel</button>
            </div>
            <div class="d-flex">
                <span class="fs-4">Add expense</span>
            </div>
            <form id="addexpense-step2-save-form" class="d-flex">
                <button id="save-btn" class="btn btn-primary w-100" type="submit">Save</button>
            </form>
        </div>
    </nav>

    <div class="row py-2">
        <div class="col-sm-4 col-lg-2">
            With <strong>you</strong> and:
        </div>
        <div class="col-sm-8 col-lg-10" id="addexpense-step2-friend-list"></div>
    </div>

    <div class="row">
        <div class="col">
            <div id="error-banner" class="error-banner alert alert-danger">
                <span id="error-message">Test</span>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col text-center">
            <form id="addexpense-step2-expense-form">
                <div class="mb-3 input-group">
                    <span class="input-group-text">Description</span>
                    <input type="text" class="form-control" id="addexpense-step2-description" placeholder="Enter a description">
                </div>
                <div class="mb-3 input-group">
                    <select class="form-select" id="addexpense-step2-currency">
                        <option value="NZD" selected>NZD</option>
                        <option value="BRL">BRL</option>
                    </select>
                    <span class="input-group-text">$</span>
                    <input id="addexpense-step2-expense-value" type="number" class="form-control" min="0.00" step="0.01" value="0.00" inputmode="decimal"/>
                </div>
                <button type="button" id="paymentOptions" class="btn btn-warning" data-bs-toggle="modal"
                        data-bs-target="#paymentOptionsModal" disabled>Payment options
                </button>
            </form>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="paymentOptionsModal" tabindex="-1" aria-labelledby="paymentOptionsModalLabel"
         aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="paymentOptionsModalLabel">Expense details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="addexpense-step2-modal-btn-cancel-2"></button>
                </div>
                <div class="modal-body">
                    <div id="carouselOptions" class="carousel slide" data-bs-ride="false">
                        <div class="row">
                            <div class="col-6">
                                <button type="button"
                                        data-bs-target="#carouselOptions"
                                        data-bs-slide-to="0"
                                        class="btn btn-primary w-100">
                                    1.23
                                </button>
                            </div>
                            <div class="col-6">
                                <button type="button"
                                        data-bs-target="#carouselOptions"
                                        data-bs-slide-to="1"
                                        class="btn btn-primary w-100">
                                    %
                                </button>
                            </div>

                        </div>
                        <div class="carousel-inner addexpense-carousel-inner">
                            <div class="carousel-item active">
                                <div class="d-block w-100">
                                    <div class="row py-4 text-center">
                                        <strong>Split by exact amounts</strong>
                                        <small>Select exactly how much each person owes</small>
                                    </div>
                                    <div id="addexpense-step2-exact-error" class="small alert alert-danger p-2 d-none"></div>
                                    <div id="addexpense-step2-modal-list-exact-amounts-list"></div>
                                </div>
                            </div>
                            <div class="carousel-item">
                                <div class="d-block w-100">
                                    <div class="row py-4 text-center">
                                        <strong>Split by percentages</strong>
                                        <small>Enter the percentage split that's fair for your situation</small>
                                    </div>
                                    <div id="addexpense-step2-pct-error" class="small alert alert-danger p-2 d-none"></div>
                                    <div id="addexpense-step2-modal-list-percentage-list"></div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="addexpense-step2-modal-btn-cancel-1">Cancel</button>
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Done</button>
                </div>
            </div>
        </div>
    </div>


</div>


<script src="vendor/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/signout.js"></script>
<script src="js/addexpense-step2.js"></script>
</body>
</html>
