<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open Splitwise - Add Expense</title>
    <link href="vendor/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/addexpense.css" rel="stylesheet">
</head>
<body>


<div class="container-sm">
    <div>
        <img src="img/logo.png" alt="" width="48"/>
        <span class="p-2">Open Splitwise</span>
    </div>
    <nav class="navbar navbar-light">
        <form action="friends.html">
            <button class="btn btn-secondary w-100" type="submit">Cancel</button>
        </form>
        <h3>Add expense</h3>
        <form action="#">
            <button class="btn btn-primary  w-100" type="submit">Save</button>
        </form>
    </nav>

    <div class="row py-2">
        <div class="col-sm-4 col-lg-2">
            With <strong>you</strong> and:
        </div>
        <div class="col-sm-8 col-lg-10">
            <div class="d-inline-block addexpense-step2-friend-wrapper">
                <img class="d-inline" src="vendor/img/icons/person.svg" alt="placeholder"/>
                <h3 class="d-inline">Tatiana Almeida</h3>
            </div>
        </div>
    </div>

    <div class="row py-4">
        <div class="col text-center">
            <form>
                <div class="mb-3 input-group">
                    <span class="input-group-text">Description</span>
                    <input type="text" class="form-control" placeholder="Enter a description">
                </div>
                <div class="mb-3 input-group">
                    <select class="form-select" id="inputGroupSelect04">
                        <option value="NZD" selected>NZD</option>
                        <option value="BRL">BRL</option>
                    </select>
                    <span class="input-group-text">$</span>
                    <input type="number" class="form-control" min="0.00" step="0.01" value="0.00"/>
                </div>
                <button type="button" id="paymentOptions" class="btn btn-warning" data-bs-toggle="modal"
                        data-bs-target="#paymentOptionsModal">Paid by you and split equally
                </button>
            </form>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="paymentOptionsModal" tabindex="-1" aria-labelledby="paymentOptionsModalLabel"
         aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="paymentOptionsModalLabel">Expense details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                </div>
                <div class="modal-body addexpense-expensedetails-modal">
                    <div id="carouselOptions" class="carousel slide" data-bs-ride="false">
                        <div class="row">
                            <div class="col-4">
                                <button type="button"
                                        data-bs-target="#carouselOptions"
                                        data-bs-slide-to="0"
                                        aria-current="true"
                                        class="btn btn-primary w-100">
                                    =
                                </button>
                            </div>
                            <div class="col-4">
                                <button type="button"
                                        data-bs-target="#carouselOptions"
                                        data-bs-slide-to="1"
                                        class="btn btn-primary w-100">
                                    1.23
                                </button>
                            </div>
                            <div class="col-4">
                                <button type="button"
                                        data-bs-target="#carouselOptions"
                                        data-bs-slide-to="2"
                                        class="btn btn-primary w-100">
                                    %
                                </button>
                            </div>

                        </div>
                        <div class="carousel-inner">
                            <div class="carousel-item active">
                                <div class="d-block w-100"> slide 1</div>
                            </div>
                            <div class="carousel-item">
                                <div class="d-block w-100"> slide 2</div>
                            </div>
                            <div class="carousel-item">
                                <div class="d-block w-100"> slide 3</div>
                            </div>
                        </div>

                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save changes</button>
                </div>
            </div>
        </div>
    </div>


</div>


<script src="vendor/js/bootstrap.bundle.min.js"></script>
<script src="js/addexpense.js"></script>
</body>
</html>
