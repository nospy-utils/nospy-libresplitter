<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open Splitwise - Home</title>
    <link href="vendor/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/friend-detail.css" rel="stylesheet">
</head>
<body>


<div class="container-sm">
    @@include('./header.html')

    <div class="container content-with-tabbar">
        <nav class="navbar navbar-light">
            <div class="row py-2">
                <div class="col">
                    <h3>Tatiana Almeida</h3>
                    <h4>
                        Overall, you are owed
                        <span class="positive">$941.78</span> +
                        <span class="negative">R$1,176.96</span>
                    </h4>
                </div>
            </div>
        </nav>

        <div>
            <div class="row py-2">
                <div class="col-1 text-start">
                    <div class="row">
                        <div class="col">
                            <small>Apr</small>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            13
                        </div>
                    </div>
                </div>
                <div class="col-2">
                    <div class="expense-thumbnail">
                        <img src="vendor/img/icons/receipt.svg" alt=""/>
                    </div>
                </div>
                <div class="col">
                    <div class="row">
                        <div class="col">
                            ${description}
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <small>You paid $240.00</small>
                        </div>
                    </div>
                </div>
                <div class="col-3 text-end">
                    <div class="row">
                        <div class="col">
                            <span class="positive">you lent</span>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <span class="positive">$120.00</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row py-2">
                <div class="col-1 text-start">
                    <div class="row">
                        <div class="col">
                            <small>Apr</small>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            13
                        </div>
                    </div>
                </div>
                <div class="col-2">
                    <div class="expense-thumbnail">
                        <img src="vendor/img/icons/receipt.svg" alt=""/>
                    </div>
                </div>
                <div class="col">
                    <div class="row">
                        <div class="col">
                            ${description}
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <small>${friendName} paid $100.00</small>
                        </div>
                    </div>
                </div>
                <div class="col-3 text-end">
                    <div class="row">
                        <div class="col">
                            <span class="negative">you borrowed</span>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <span class="negative">$50.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    @@include('./footer.html')
</div>


<script src="vendor/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/signout.js"></script>
</body>
</html>
