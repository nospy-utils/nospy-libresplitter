<!DOCTYPE html>
<html lang="en">
<head>
    @@include('./head-common.html')
    <title>LibreSplitter - Home</title>
    <link href="css/friend-detail.css" rel="stylesheet">
</head>
<body>


<div class="container-sm">
    @@include('./navbar.html')

    <div class="container content-with-tabbar">
        <nav class="navbar navbar-light">
            <div class="row py-2">
                <div class="col">
                    <h3 id="friend-name"></h3>
                    <h4 id="friend-summary"></h4>
                </div>
            </div>
        </nav>

        <div id="error-banner" class="error-banner alert alert-danger mt-3">
            <span id="error-message"></span>
        </div>

        <div class="row">
            <div class="col">
                <form id="friend-details-settle-form" method="get" action="settle-step1.html">
                    <input type="hidden" name="user_id" id="friend-details-settle-user-id">
                    <button class="btn btn-warning" type="submit">Settle up</button>
                </form>
            </div>
        </div>

        <div id="expenses-list"></div>
        <div id="scroll-sentinel"></div>
        <div id="loading-spinner" class="text-center py-3">
            <div class="spinner-border spinner-border-sm text-secondary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

    </div>

    @@include('./footer.html')
</div>


<script src="vendor/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/signout.js"></script>
<script src="js/friend-detail.js"></script>
</body>
</html>
