<!DOCTYPE html>
<html lang="en">
<head>
    @@include('./head-common.html')
    <title>LibreSplitter - Activity</title>
    <link href="css/activity.css" rel="stylesheet">
</head>
<body>

<div class="container-sm">
    @@include('./navbar.html')

    <div id="activity-loadingpage-container" class="content-with-tabbar d-flex justify-content-center align-items-center ">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div id="activity-content-container" class="container content-with-tabbar invisible d-none">
        <nav class="navbar navbar-light">
            <div class="row py-2">
                <div class="col">
                    <h3>Recent activity</h3>
                </div>
            </div>
        </nav>
        <div id="error-banner" class="error-banner alert alert-danger mt-3">
            <span id="error-message"></span>
        </div>

        <div id="activity-list"></div>
        <div id="scroll-sentinel"></div>
        <div id="loading-spinner" class="text-center py-3">
            <div class="spinner-border spinner-border-sm text-secondary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    @@include('./footer.html')
</div>


<script src="vendor/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/signout.js"></script>
<script src="js/activity.js"></script>
</body>
</html>
