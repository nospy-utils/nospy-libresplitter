<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none';">
    <title>LibreSplitter - Activity</title>
    <link href="vendor/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/activity.css" rel="stylesheet">
</head>
<body>

<div class="container-sm">
    @@include('./header.html')

    <div class="container content-with-tabbar">
        <nav class="navbar navbar-light">
            <div class="row py-2">
                <div class="col">
                    <h3>Recent activity</h3>
                </div>
            </div>
        </nav>
        <div id="error-banner" class="error-banner alert alert-danger mt-3">
            <span id="error-message"></span>
        </div>

        <div id="activity-list"></div>
        <div id="scroll-sentinel"></div>
        <div id="loading-spinner" class="text-center py-3">
            <div class="spinner-border spinner-border-sm text-secondary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    @@include('./footer.html')
</div>


<script src="vendor/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/signout.js"></script>
<script src="js/activity.js"></script>
</body>
</html>
