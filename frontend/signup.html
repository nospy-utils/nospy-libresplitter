<!doctype html>
<html lang="en">

<head>
    @@include('./head-common.html')
    <title>LibreSplitter - Sign-up</title>
    <link href="css/signup.css" rel="stylesheet">
</head>

<body>
<div class="wrapper">
    <div class="container-sm">
        <form>
            <img class="mb-4" src="img/logo.png" alt="" width="72">
            <span>LibreSplitter</span>
            <h1 class="h3 mb-3 fw-normal">Sign up</h1>

            <div class="form-floating">
                <input type="text" class="form-control" id="name" placeholder="Your name" autocomplete="given-name">
                <label for="name">Name</label>
            </div>
            <div class="form-floating">
                <input type="email" class="form-control" id="email" placeholder="name@example.com" autocomplete="off">
                <label for="email">Email address</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" id="password" placeholder="Password">
                <label for="password">Password</label>
            </div>

            <div id="signup-error" class="alert alert-danger mt-3 invisible"></div>

            <div class="row gy-2">
                <button class="btn btn-primary py-2" type="submit">Sign up</button>
            </div>
        </form>
    </div>
</div>


<script src="vendor/js/popper.min.js"></script>
<script src="vendor/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/signup.js"></script>
</body>

</html>
