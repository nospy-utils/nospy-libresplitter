<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Open Splitwise - Home</title>
    <link href="vendor/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/friends.css" rel="stylesheet">
</head>
<body>


<div class="container-sm">
    <div>
        <img src="img/logo.png" alt="" width="48"/>
        <span class="p-2">Open Splitwise</span>
    </div>

    <nav class="navbar navbar-light">
        <div class="row py-2">
            <div class="col">
                <h3>
                    Overall, you are owed
                    <span class="positive">$941.78</span> +
                    <span class="negative">R$1,176.96</span>
                </h3>
            </div>
        </div>
        <form action="addfriend.html">
            <button class="btn btn-outline-success" type="submit">Add Friends</button>
        </form>
    </nav>

    <div class="container content-with-tabbar">
        <div class="row py-2">
            <div class="col-8">
                <div class="row">
                    <div class="col-1">
                        <div class="friend-thumbnail">
                            <img src="vendor/img/icons/person.svg"
                                 alt="placeholder" width="64" height="64"/>
                        </div>
                    </div>
                    <div class="col-11 px-4 align-content-center">
                        <h3>Tatiana Almeida</h3>
                    </div>
                </div>
            </div>
            <div class="col-4 align-content-center text-end">
                Owes you <span class="positive">$941.78</span>
            </div>
        </div>


    </div>

    @@include('./footer.html')
</div>


<script src="vendor/js/popper.min.js"></script>
<script src="vendor/js/bootstrap.bundle.min.js"></script>
</body>
</html>
