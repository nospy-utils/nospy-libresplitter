<!doctype html>
<html lang="en">

<head>
    @@include('./head-common.html')
    <title>LibreSplitter - Sign-in</title>
    <link href="css/signin.css" rel="stylesheet">
</head>

<body>
<div class="wrapper">
    <div class="container-sm">
        <form>
            <img class="mb-4" src="img/logo.png" alt="" width="72">
            <span>LibreSplitter</span>
            <h1 class="h3 mb-3 fw-normal">Sign in</h1>

            <div id="created-user-banner" class="alert alert-success invisible d-none">
                Account created! Sign in to get started.
            </div>

            <div id="unauthenticated-user-banner" class="alert alert-warning invisible d-none">
                Your session has expired. Please sign in again.
            </div>

            <div class="form-floating">
                <input type="email" class="form-control" id="email" placeholder="name@example.com">
                <label for="email">Email address</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" id="password" placeholder="Password">
                <label for="password">Password</label>
            </div>

            <div id="signin-error" class="alert alert-danger mt-3 invisible d-none"></div>
            <button class="btn btn-primary mt-4 w-100" type="submit">Sign in</button>
            <div class="text-center align-content-center">or</div>
            <button id="signin-button-signup" class="btn btn-secondary w-100" type="button">Sign up</button>
        </form>
    </div>
</div>


<script src="vendor/js/popper.min.js"></script>
<script src="vendor/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/signin.js"></script>
</body>

</html>
