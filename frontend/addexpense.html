<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Open Splitwise - Add Expense</title>
    <link href="vendor/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/addexpense.css" rel="stylesheet">
</head>
<body>


<div class="container-sm">
    <div>
        <img src="img/logo.png" alt="" width="48"/>
        <span class="p-2">Open Splitwise</span>
    </div>
    <nav class="navbar navbar-light">
        <form action="friends.html">
            <button class="btn btn-secondary w-100" type="submit">Cancel</button>
        </form>
        <h3>Add expense</h3>
        <form action="#">
            <button class="btn btn-primary  w-100" type="submit">Save</button>
        </form>
    </nav>

    <div class="row py-2">
        <div class="col">
            <small>Recent</small>
        </div>
    </div>

    <div class="container addexpense-content">
        <div class="row py-2">
            <div class="col-sm-2 col-lg-1 d-none d-sm-block">
                <div class="addexpense-friend-thumbnail">
                    <img src="vendor/img/icons/person.svg" alt="placeholder"/>
                </div>
            </div>
            <div class="col-sm-10 col-lg-11 align-content-center">
                <div class="addexpense-list-name">
                    <h3>Tatiana Almeida</h3>
                </div>
                <div class="addexpense-list-input">
                    <input class="form-check-input addexpense-radio-input" type="checkbox" checked>
                </div>
            </div>
        </div>
    </div>

</div>


<script src="vendor/js/popper.min.js"></script>
<script src="vendor/js/bootstrap.bundle.min.js"></script>
</body>
</html>
